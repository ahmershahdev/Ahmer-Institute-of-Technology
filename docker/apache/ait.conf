ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    RedirectMatch 302 ^/$ /AIT/

    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/AIT>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/lib/ait>
        Require all denied
        Options None
        php_admin_flag engine off
    </Directory>

    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/AIT/(docker|tests|bin|node_modules|docs|\.github|database)(/|$)">
        Require all denied
    </LocationMatch>
</VirtualHost>

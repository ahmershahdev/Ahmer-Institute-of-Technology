; Hardened PHP runtime for AIT (container image)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 30
max_input_time = 30
max_input_vars = 2000
allow_url_fopen = Off
allow_url_include = Off
file_uploads = On
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 12
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec,dl
; proc_open stays enabled: the PDF disarm step runs Ghostscript with an argv array (no shell).
date.timezone = Asia/Karachi
default_charset = UTF-8

; Sessions live in Redis so they survive container restarts and scale horizontally.
session.save_handler = redis
session.save_path = "tcp://redis:6379?prefix=ait_sess:&timeout=2"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 1800

; OPcache + JIT
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${OPCACHE_VALIDATE}
opcache.revalidate_freq = 2
opcache.save_comments = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

apc.enabled = 1
apc.shm_size = 64M

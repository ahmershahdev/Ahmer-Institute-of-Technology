# Local + CI stack for Ahmer Institute of Technology.
#   1. ./bin/docker-init.sh      (writes .env.docker with random secrets)
#   2. docker compose up -d --build
#   3. open http://localhost:8080/AIT/
name: ait

x-app-env: &app-env
  env_file: .env.docker

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/ahmershahdev/ahmer-institute-of-technology:latest
    <<: *app-env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CLAMAV_HOST: clamav
      UPLOAD_ROOT: /var/lib/ait/uploads
      OPCACHE_VALIDATE: "1"
    ports:
      - "${AIT_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html/AIT
      - uploads:/var/lib/ait/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    <<: *app-env
    command: ["--default-authentication-plugin=caching_sha2_password", "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

volumes:
  dbdata:
  uploads:

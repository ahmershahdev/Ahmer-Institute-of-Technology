name: AIT quality checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ait_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, mysqli, fileinfo, gd, openssl
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './uploads/*' -print0 | xargs -0 -n1 php -l

      - name: Check tracked file whitespace
        run: git diff --check

      - name: Verify public route configuration
        run: |
          test -f .htaccess
          grep -q 'RewriteRule \^about' .htaccess
          grep -q 'RewriteRule \^programs' .htaccess
          grep -q 'RewriteRule \^dashboard' .htaccess
          grep -q 'RewriteRule \^student-dashboard' .htaccess
          grep -q 'RewriteRule \^student-login' .htaccess
          grep -q 'RewriteRule \^campus-life' .htaccess

      - name: Import schema into CI database
        shell: bash
        run: |
          test -f database/schema.sql
          mysql -uroot -proot < database/schema.sql
          test "$(mysql -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'ait'")" -gt 0

      - name: Scan for hardcoded secrets
        shell: bash
        run: |
          # .env must never be committed; fail if it is tracked.
          if git ls-files | grep -qx '\.env'; then
            echo "::error::.env is tracked in git history — remove it and rotate any exposed secrets."
            exit 1
          fi
          # Flag obvious hardcoded credentials outside of .env/.env.example (password hashes in seed data are expected in database/schema.sql).
          if grep -RnoE "(password|secret|api_key)\s*=\s*['\"][^'\"]{6,}['\"]" --include='*.php' . | grep -v 'database/schema.sql' | grep -viE "\\\$_(POST|GET|REQUEST|SESSION)|password_hash|password_verify"; then
            echo "::error::Possible hardcoded credential found in PHP source — use ait_env()/.env instead."
            exit 1
          fi

      - name: Check for debug leftovers
        shell: bash
        run: |
          if grep -RnoE "\b(var_dump|print_r\s*\(|die\s*\(\s*['\"]?debug|dd\()" --include='*.php' . ; then
            echo "::error::Debug statement left in PHP source."
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and static checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, mysqli, fileinfo, gd, openssl
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './tests/e2e/node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD -- . ':!assets/vendor' ':!assets/css/bootstrap*' ':!assets/js/bootstrap*' > /dev/null || true

      - name: Route map and project layout
        shell: bash
        run: |
          for route in about programs admissions campus-life faq contact dashboard student-dashboard student-login 'sitemap\\.xml' 'robots\\.txt'; do
            grep -qE "RewriteRule \^\(?.*${route}" .htaccess || { echo "::error::.htaccess has no route for ${route}"; exit 1; }
          done
          for f in dashboard.php log-in.php registration.php generate_challan.php download_file.php 404.php; do
            [ ! -f "$f" ] || { echo "::error::$f must live in a role folder, not the repository root"; exit 1; }
          done

      - name: No secrets, debug output, or inline event handlers
        shell: bash
        run: |
          if git ls-files | grep -qE '(^|/)\.env(\.docker)?$'; then echo "::error::An .env file is tracked"; exit 1; fi
          if grep -RnoE "(password|secret|api_key)\s*=\s*['\"][^'\"]{6,}['\"]" --include='*.php' . | grep -vE 'database/schema.sql|tests/' | grep -viE "_(POST|GET|REQUEST|SESSION)|password_hash|password_verify"; then
            echo "::error::Possible hardcoded credential"; exit 1
          fi
          if grep -RnoE "\b(var_dump|print_r\s*\(|dd\()" --include='*.php' . ; then echo "::error::Debug output left in PHP"; exit 1; fi
          if grep -RnE ' on(click|change|submit|load|input)="' --include='*.php' . ; then echo "::error::Inline event handlers are blocked by the CSP"; exit 1; fi

  e2e:
    name: Docker stack, backend tests, and Playwright E2E
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Generate local secrets
        run: sh bin/docker-init.sh

      - name: Start the stack (web, MySQL, Redis, ClamAV)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Create the bootstrap super-admin
        run: |
          set -a; . ./.env.docker; set +a
          docker compose exec -T -e AIT_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" web php bin/create-admin.php --email="$E2E_ADMIN_EMAIL" --name="CI Super Admin"

      - name: Backend tests
        run: docker compose exec -T web php tests/php/run.php

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests/e2e
        run: npm ci || npm install && npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

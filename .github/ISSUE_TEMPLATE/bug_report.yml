name: Bug report
description: Something in AIT does not work as expected
labels: [bug]
body:
  - type: input
    id: page
    attributes: { label: Page or portal, placeholder: "e.g. /admin/dashboard.php or Applicant login" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. ...\n2. ...\n3. ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected and what happened }
    validations: { required: true }
  - type: dropdown
    id: env
    attributes: { label: Environment, options: [Docker, XAMPP, Production] }
